# Zsh-specific prompt. Select with STARSHIP_CONFIG=~/.config/starship-zsh.toml.
add_newline = false
command_timeout = 500

format = """
[](fg:bright-black)\
$status\
[](fg:bright-black bg:blue)\
$directory\
[](fg:blue bg:green)\
$git_branch\
$git_status\
[](fg:green bg:bright-black)\
$direnv\
$mise\
$nix_shell\
$rust\
$golang\
$nodejs\
$php\
$java\
$python\
$ruby\
$lua\
$container\
$kubernetes\
$terraform\
$aws\
$gcloud\
$jobs\
[](fg:bright-black bg:black)\
$cmd_duration\
[](fg:black bg:red)\
$time\
[](fg:red)\
$line_break\
$character
"""

[directory]
format = "[ $path$read_only ]($style)"
style = "bold black bg:blue"
repo_root_style = "bold black bg:blue"
repo_root_format = "[ $repo_root]($repo_root_style)[$path$read_only ]($style)"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
style = "bold black bg:green"
symbol = " "
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bold black bg:green"
conflicted = "~${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇣${behind_count}⇡${ahead_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
typechanged = "≠${count} "

[status]
disabled = false
format = "[ $status ](bold red bg:bright-black)"

[cmd_duration]
min_time = 3000
show_milliseconds = false
format = "[ 󰔛 $duration ](bold yellow bg:black)"

[jobs]
format = "[ $symbol$number ](bold cyan bg:bright-black)"
symbol = "󰒓 "
number_threshold = 1
symbol_threshold = 1

[direnv]
disabled = false
format = "[ $symbol$loaded ](bold yellow bg:bright-black)"
symbol = "󰌪 "

[mise]
disabled = true
format = "[ $symbol$health ](bold cyan bg:bright-black)"
symbol = "󰏗 "

[python]
format = "[ $symbol$virtualenv ](bold yellow bg:bright-black)"
symbol = " "

[nodejs]
format = "[ $symbol$version ](bold green bg:bright-black)"
symbol = " "

[golang]
format = "[ $symbol$version ](bold cyan bg:bright-black)"
symbol = " "

[rust]
format = "[ $symbol$version ](bold red bg:bright-black)"
symbol = " "

[ruby]
format = "[ $symbol$version ](bold red bg:bright-black)"
symbol = " "

[java]
format = "[ $symbol$version ](bold yellow bg:bright-black)"
symbol = " "

[lua]
format = "[ $symbol$version ](bold blue bg:bright-black)"
symbol = " "

[php]
format = "[ $symbol$version ](bold purple bg:bright-black)"
symbol = " "

[kubernetes]
disabled = false
format = "[ $symbol$context(::$namespace) ](bold blue bg:bright-black)"
symbol = "󱃾 "

[terraform]
format = "[ $symbol$workspace ](bold purple bg:bright-black)"
symbol = "󱁢 "

[aws]
format = "[ $symbol$profile(::$region) ](bold yellow bg:bright-black)"
symbol = "󰸏 "

[gcloud]
format = "[ $symbol$account(@$domain)(::$project) ](bold blue bg:bright-black)"
symbol = "󱇶 "

[nix_shell]
format = "[ $symbol$state(::$name) ](bold cyan bg:bright-black)"
symbol = " "

[container]
format = "[ $symbol$name ](bold red bg:bright-black)"
symbol = " "

[time]
disabled = false
format = "[  $time ](bold black bg:red)"
time_format = "%H:%M"

[character]
disabled = false
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold green)"
vimcmd_replace_one_symbol = "[](bold purple)"
vimcmd_replace_symbol = "[](bold purple)"
vimcmd_visual_symbol = "[](bold cyan)"
