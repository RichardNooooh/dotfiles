[project]
name = "notebook-renderer-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "nbformat>=5.10,<6",
  "pillow>=10,<12",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ty>=0.0.1a25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["notebook_experiment", "tests"]
