---
- name: Converge
  hosts: all
  become: true

  vars:
    dotfiles_user: "molecule"
    dotfiles_home: "/home/molecule"
    dotfiles_repo: "/home/molecule/.dotfiles"
    dotfiles_stow_folders: "zsh,tmux"

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install required packages (git, build deps)
      ansible.builtin.apt:
        name:
          - git
          - perl
          - make
          - tar
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Download stow source
      ansible.builtin.get_url:
        url: https://ftp.gnu.org/gnu/stow/stow-2.4.1.tar.gz
        dest: /tmp/stow-2.4.1.tar.gz
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    - name: Extract stow source
      ansible.builtin.unarchive:
        src: /tmp/stow-2.4.1.tar.gz
        dest: /tmp/
        remote_src: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Configure stow
      ansible.builtin.command:
        cmd: ./configure --prefix=/usr/local
        chdir: /tmp/stow-2.4.1
        creates: /tmp/stow-2.4.1/Makefile
      when: ansible_facts['os_family'] == "Debian"

    - name: Build and install stow
      ansible.builtin.command:
        cmd: make install
        chdir: /tmp/stow-2.4.1
      when: ansible_facts['os_family'] == "Debian"

    - name: Create test user
      ansible.builtin.user:
        name: molecule
        shell: /bin/bash
        home: /home/molecule
        create_home: true

    - name: Create dotfiles directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /home/molecule/.dotfiles
        - /home/molecule/.dotfiles/zsh
        - /home/molecule/.dotfiles/tmux
        - /home/molecule/.dotfiles/mise/.config/mise

    - name: Create test config files
      ansible.builtin.copy:
        content: "# Test zshrc"
        dest: "/home/molecule/.dotfiles/zsh/.zshrc"

    - name: Create test tmux config
      ansible.builtin.copy:
        content: "# Test tmux.conf"
        dest: "/home/molecule/.dotfiles/tmux/.tmux.conf"

    - name: Create mock mise config directory structure
      ansible.builtin.file:
        path: /home/molecule/.dotfiles/mise/.config/mise
        state: directory
        mode: "0755"

    - name: Create mock mise.toml
      ansible.builtin.copy:
        content: |
          [tools]
          python = "latest"
        dest: "/home/molecule/.dotfiles/mise/.config/mise/config.toml"

    - name: Change ownership
      ansible.builtin.file:
        path: /home/molecule
        state: directory
        recurse: true
        owner: molecule
        group: molecule
        follow: no
      changed_when: false

  roles:
    - role: dotfiles
      become: false
