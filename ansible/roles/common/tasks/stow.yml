---
# Build and install GNU Stow 2.4.1 from source

- name: common | Check if stow is installed
  ansible.builtin.stat:
    path: /usr/local/bin/stow
  register: common_stow_installed

- name: common | Install stow build dependencies
  ansible.builtin.package:
    name:
      - perl
      - make
      - tar
    state: present
  become: true
  when: not common_stow_installed.stat.exists

- name: common | Download stow source
  ansible.builtin.get_url:
    url: https://ftp.gnu.org/gnu/stow/stow-2.4.1.tar.gz
    dest: /tmp/stow-2.4.1.tar.gz
    mode: "0644"
  when: not common_stow_installed.stat.exists

- name: common | Extract stow source
  ansible.builtin.unarchive:
    src: /tmp/stow-2.4.1.tar.gz
    dest: /tmp/
    remote_src: true
  when: not common_stow_installed.stat.exists

- name: common | Configure stow
  ansible.builtin.command:
    cmd: ./configure --prefix=/usr/local
    chdir: /tmp/stow-2.4.1
    creates: /tmp/stow-2.4.1/Makefile
  when: not common_stow_installed.stat.exists

- name: common | Build and install stow
  ansible.builtin.command:
    cmd: make install
    chdir: /tmp/stow-2.4.1
  become: true
  when: not common_stow_installed.stat.exists
