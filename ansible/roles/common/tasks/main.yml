---
# Common role - base system packages
# Uses generic package module with OS-specific variable files

- name: common | Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: common | Update package cache and install base packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
  become: true

- name: common | Build and install stow from source
  ansible.builtin.import_tasks: stow.yml

- name: common | Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/bin"
    state: directory
    mode: "0755"
  become: false

- name: common | Ensure fonts directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/share/fonts"
    state: directory
    mode: "0755"
  become: false

# WSL clipboard: install win32yank.exe for reliable clipboard copy inside tmux
- name: common | Check if running on WSL (for clipboard setup)
  ansible.builtin.shell:
    cmd: grep -qi microsoft /proc/version 2>/dev/null
  register: common_wsl_check
  changed_when: false
  failed_when: false

- name: common | Download win32yank archive (WSL clipboard utility)
  ansible.builtin.get_url:
    url: "{{ common_win32yank_url }}"
    dest: /tmp/win32yank.zip
    mode: "0644"
  when: common_wsl_check.rc == 0
  become: false

- name: common | Extract win32yank.exe to local bin
  ansible.builtin.unarchive:
    src: /tmp/win32yank.zip
    dest: "{{ dotfiles_home }}/.local/bin/"
    remote_src: true
  when: common_wsl_check.rc == 0
  become: false

- name: common | Ensure win32yank.exe is executable
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/bin/win32yank.exe"
    mode: "0755"
  when: common_wsl_check.rc == 0
  become: false
