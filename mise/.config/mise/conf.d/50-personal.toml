[tools]
# Personal development tools not supplied by Omarchy packages.
go = "1.26"
uv = "latest"
sops = "latest"
stylua = "latest"
odin = { version = "latest", version_prefix = "dev-", asset_pattern = "odin-linux-amd64-*.tar.gz" }
"pipx:pre-commit" = "4.6.1"
yq = "latest"

[settings]
minimum_release_age = "5d"
experimental = false

[settings.python]
uv_venv_auto = true

[env]
OPENCODE_ENABLE_EXA = "1"
CRAWL4AI_API_TOKEN = { value = "{{ exec(command='sops --decrypt ~/.local/share/homelab-secrets/docker/citadel/web-research/crawl4ai-api-token.sops.txt') | trim }}", redact = true, tools = true }

[tasks."latex:preview"]
description = "Render Markdown with LaTeX to a standalone HTML preview"
run = "cd \"$MISE_ORIGINAL_CWD\" && node \"${HOME}/.config/mise/latex-preview/render.mjs\" \"$@\""
