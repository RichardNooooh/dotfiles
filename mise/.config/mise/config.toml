[tools]
# Core development tools
# python = "3.14"
go = "1.26"
node = "25"
neovim = "latest"
uv = "latest"

# Mise-related tooling
usage = "latest"

# Secret Management
sops = "latest"

# Additional useful tools
stylua = "latest"
"pipx:pre-commit" = "4.6.1"
fd = "latest"
ripgrep = "latest"
fzf = "latest"
tree-sitter = "latest"

# CI/CD testing tools
# act = "latest"

# AI
opencode = "latest"

# Misc tools
tlrc = "latest"
jq = "latest"
yq = "latest"
lazygit = "latest"
github-cli = "latest"

[settings]
minimum_release_age = "7d"
# Enable experimental features if needed
experimental = false

# Plugin settings
[settings.python]
# Use uv for Python package management
uv_venv_auto = true

[env]
OPENCODE_ENABLE_EXA = "1"
